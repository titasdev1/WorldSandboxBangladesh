name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      map_package:
        description: "Map to install for this Android build"
        required: true
        type: choice
        default: greater_dhaka
        options:
          - greater_dhaka
          - shariatpur_review
  pull_request:
    branches: [ main ]
    paths:
      - "**.gd"
      - "**.tscn"
      - "project.godot"
      - "content/**"
      - "assets/**"
      - "external_content/**"
      - "tools/fetch_*.py"
      - "tools/report_build_assets.py"
      - "tools/production_gate.py"
      - "tools/map_pipeline/shariatpur_facade_images.json"
      - "development_state.json"
      - ".github/workflows/android.yml"
  push:
    branches: [ main ]
    paths:
      - "**.gd"
      - "**.tscn"
      - "project.godot"
      - "content/**"
      - "assets/**"
      - "external_content/**"
      - "tools/fetch_*.py"
      - "tools/report_build_assets.py"
      - "tools/production_gate.py"
      - "tools/map_pipeline/shariatpur_facade_images.json"
      - "development_state.json"

permissions:
  actions: read
  contents: write

concurrency:
  group: canonical-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run production preflight gate
        shell: bash
        run: python3 tools/production_gate.py

      - name: Validate asset pipeline Python syntax
        shell: bash
        run: python3 -m py_compile tools/fetch_free_assets.py tools/fetch_city_assets.py tools/fetch_polyhaven_pbr.py tools/report_build_assets.py tools/map_pipeline/build_real_world_navigation_index.py tools/verify_apk_contents.py

      # Release/push builds retain Greater Dhaka by default. PR validation uses the
      # latest assembled Shariatpur review package so map/game changes are tested
      # together without promoting the review map as a production release.
      - name: Download pinned Greater Dhaka map package
        if: ${{ !(inputs.map_package == 'shariatpur_review' || github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shariatpur-review-apk]'))) }}
        uses: actions/download-artifact@v4
        with:
          name: Project-A-Square-Greater-Dhaka-3D-Tiles
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38618204090
          path: build/selected-map

      - name: Download latest assembled Shariatpur review package
        id: map-selection
        if: ${{ inputs.map_package == 'shariatpur_review' || github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shariatpur-review-apk]')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prefer this exact development branch. Fall back to main only for CI
          # validation; release steps below require a branch-matched map artifact.
          map_source_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          export MAP_SOURCE_BRANCH="${map_source_branch}"
          artifact_query='.artifacts[] | select(.expired == false) | select(.name | startswith("Project-A-Square-Shariatpur-Review-Map-"))'
          artifact_record="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq "${artifact_query} | select(.workflow_run.head_branch == env.MAP_SOURCE_BRANCH) | [.workflow_run.id, .name, .created_at] | @tsv" \
            | sort -k3,3 | tail -n 1)"
          if [[ -z "${artifact_record}" && "${map_source_branch}" != "main" ]]; then
            echo "No complete Shariatpur artifact yet for ${map_source_branch}; using main only for non-release validation."
            artifact_record="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq "${artifact_query} | select(.workflow_run.head_branch == \"main\") | [.workflow_run.id, .name, .created_at] | @tsv" \
              | sort -k3,3 | tail -n 1)"
          fi
          if [[ -z "${artifact_record}" ]]; then
            echo "No assembled Shariatpur review package exists yet; finish the district tile sequence first." >&2
            exit 1
          fi
          read -r map_run_id map_artifact_name map_created_at <<< "${artifact_record}"
          map_run_branch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${map_run_id}" --jq '.head_branch')"
          run_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${map_run_id}" --jq '.conclusion')"
          if [[ "${run_conclusion}" != "success" ]]; then
            echo "Selected Shariatpur package came from a non-successful workflow run; refusing promotion." >&2
            exit 1
          fi
          echo "Selected Shariatpur package: ${map_artifact_name} (branch ${map_run_branch}, run ${map_run_id}, created ${map_created_at})"
          echo "source_branch=${map_run_branch}" >> "$GITHUB_OUTPUT"
          echo "source_run_id=${map_run_id}" >> "$GITHUB_OUTPUT"
          gh run download "${map_run_id}" --repo "${GITHUB_REPOSITORY}" --name "${map_artifact_name}" --dir build/selected-map

      - name: Install and validate selected map package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_PACKAGE: ${{ (inputs.map_package == 'shariatpur_review' || github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shariatpur-review-apk]'))) && 'shariatpur_review' || 'greater_dhaka' }}
        run: |
          set -euo pipefail
          test -s build/selected-map/map_tiles_manifest.json
          test -s build/selected-map/ATTRIBUTION.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("build/selected-map")
          manifest = json.loads((root / "map_tiles_manifest.json").read_text())
          glbs = list(root.rglob("Dhaka_Explorable_Map.glb"))
          if not glbs or len(glbs) != manifest["tile_count_with_geometry"]:
              raise SystemExit("Selected map package failed GLB/manifest integrity verification")
          selected = os.environ["MAP_PACKAGE"]
          if selected == "shariatpur_review":
              # Older review packages lacked this local origin and streamed tiles
              # tens of kilometres away from the zero-position player at startup.
              game_origin = manifest.get("game_origin_lat_lon")
              if not isinstance(game_origin, list) or len(game_origin) != 2:
                  raise SystemExit("Shariatpur package lacks game_origin_lat_lon; refusing stale/broken candidate APK")
              pipeline_sha = str(manifest.get("pipeline_commit_sha", "")).strip()
              if not pipeline_sha:
                  raise SystemExit("Shariatpur package lacks pipeline_commit_sha; rebuild with the provenance gate")
              report_path = root / "quality_gate_report.json"
              if not report_path.is_file():
                  raise SystemExit("Shariatpur review package has no quality gate report")
              report = json.loads(report_path.read_text())
              if report.get("pipeline_commit_sha") != pipeline_sha:
                  raise SystemExit("Shariatpur manifest/report pipeline provenance mismatch")
              if manifest.get("build_stage") != "shariatpur_review" or not manifest.get("complete_district_map"):
                  raise SystemExit("Selected Shariatpur package is not a complete district-stage package")
              vegetation_count = int(manifest.get("feature_counts_across_tiles", {}).get("procedural_vegetation_trees", 0))
              if vegetation_count < 1:
                  raise SystemExit("Shariatpur package predates mapped-landuse vegetation generation; rebuild the district sequence")
              if report.get("status") != "REVIEW_REQUIRED":
                  raise SystemExit("Unexpected Shariatpur quality status; inspect before packaging")
              print("MAP QA MODE: Shariatpur district package is complete, but its visual/device review gate remains open.")
          elif not manifest.get("tiles"):
              raise SystemExit("Pinned Greater Dhaka package has no tile records")
          print(f"Map package: {selected}")
          print(f"GLB tiles: {len(glbs)}; bytes: {sum(p.stat().st_size for p in glbs):,}")
          print(f"Coverage: {manifest['region_south_west_north_east']}")
          PY
          if [ "$MAP_PACKAGE" = "shariatpur_review" ]; then
            # A complete but stale Shariatpur artifact once placed an interior
            # photo on an exterior wall. Refuse map packages built before the
            # explicit visual-eligibility gate entered the map pipeline.
            REQUIRED_MAP_GATE_COMMIT="503bbae0787458652635a96c74c067f6d704ca71"
            PIPELINE_SHA="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("build/selected-map/map_tiles_manifest.json").read_text()).get("pipeline_commit_sha", ""))
          PY
          )"
            if [[ -z "$PIPELINE_SHA" ]]; then
              echo "Shariatpur map manifest has no pinned pipeline SHA; refusing this candidate APK." >&2
              exit 1
            fi
            compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${REQUIRED_MAP_GATE_COMMIT}...${PIPELINE_SHA}" --jq '.status')"
            if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
              echo "Stale Shariatpur map pipeline ${PIPELINE_SHA}; it predates required photo-QA gate ${REQUIRED_MAP_GATE_COMMIT}. Refusing packaging." >&2
              exit 1
            fi
            EXPECTED_MAP_PIPELINE_SHA="$(git log -1 --format='%H' -- tools/map_pipeline .github/workflows/dhaka-3d-map.yml)"
            if [[ -z "$EXPECTED_MAP_PIPELINE_SHA" || "$PIPELINE_SHA" != "$EXPECTED_MAP_PIPELINE_SHA" ]]; then
              echo "Stale Shariatpur map artifact: package pipeline $PIPELINE_SHA, latest map-pipeline source ${EXPECTED_MAP_PIPELINE_SHA:-missing}. Refusing to publish an APK that does not contain the latest map build." >&2
              exit 1
            fi
            echo "Shariatpur pipeline provenance gate: PASS (${PIPELINE_SHA})."
          fi
          rm -rf assets/world/dhaka_tiles
          mkdir -p assets/world/dhaka_tiles
          cp -a build/selected-map/. assets/world/dhaka_tiles/
          echo "WSB_MAP_PACKAGE=$MAP_PACKAGE" >> "$GITHUB_ENV"
          {
            echo "## Selected map package"
            echo "- Source: $MAP_PACKAGE"
            echo "- Tiles: $(find assets/world/dhaka_tiles -name 'Dhaka_Explorable_Map.glb' | wc -l)"
            if [ "$MAP_PACKAGE" = "shariatpur_review" ]; then
              echo "- Status: review build only; not promoted as a final map"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build named-place and road-routing index for selected map
        shell: bash
        run: |
          set -euo pipefail
          if find assets/world/dhaka_tiles -type f -name '*.geojson' -print -quit | grep -q .; then
            python3 tools/map_pipeline/build_real_world_navigation_index.py \
              --source assets/world/dhaka_tiles \
              --out assets/world/dhaka_tiles/real_world_navigation_index.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("assets/world/dhaka_tiles/real_world_navigation_index.json").read_text(encoding="utf-8"))
          counts = report.get("counts", {})
          print("Offline navigation index:", json.dumps({
              "named_roads": counts.get("named_roads", 0),
              "unnamed_roads": counts.get("unnamed_roads", 0),
              "named_places": counts.get("named_places", 0),
              "buildings_with_source_floor_count": counts.get("buildings_with_source_floor_count", 0),
              "independently_verified_floor_counts": counts.get("buildings_with_independently_verified_floor_count", 0),
          }, ensure_ascii=False))
          PY
          else
            echo "::warning::Selected map package has no source GeoJSON; named search and offline routing will be unavailable."
          fi

      - name: Restore Godot import cache for the pinned map assets
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/editor
            .godot/uid_cache.bin
          key: ${{ runner.os }}-godot-4.4.1-${{ hashFiles('project.godot', '**/*.import', 'assets/world/dhaka_tiles/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.4.1-

      - name: Validate Godot project scripts and startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot-validation"
          mkdir -p "$GODOT_DIR"
          curl -L --fail --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          GODOT="$GODOT_DIR/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          set +e
          timeout 2400s "$GODOT" --headless --editor --path . --quit > "$GODOT_DIR/import.log" 2>&1
          IMPORT_STATUS=$?
          cat "$GODOT_DIR/import.log"
          set -e
          # Godot 4.4.1 has a confirmed headless GLTF scene-preview bug that emits
          # ERROR: Parameter "t" is null. while importing GLB files (godotengine/godot#108994).
          # Ignore only that exact renderer-preview error; keep failing on all other errors and script failures.
          if [ "$IMPORT_STATUS" -ne 0 ] \
            || grep -E "SCRIPT ERROR:|Parse Error|Failed to load script" "$GODOT_DIR/import.log" \
            || (grep -E "ERROR:" "$GODOT_DIR/import.log" | grep -vF 'ERROR: Parameter "t" is null.'); then
            echo "Godot editor/import validation failed."
            exit 1
          fi
          if grep -Fq 'ERROR: Parameter "t" is null.' "$GODOT_DIR/import.log"; then
            echo "Known Godot 4.4.1 headless GLTF preview warning observed; script checks passed."
          fi
          set +e
          timeout 30s "$GODOT" --headless --path . --quit-after 120 > "$GODOT_DIR/startup.log" 2>&1
          START_STATUS=$?
          cat "$GODOT_DIR/startup.log"
          set -e
          if [ "$START_STATUS" -ne 0 ] && [ "$START_STATUS" -ne 124 ]; then
            echo "Godot headless startup exited with status $START_STATUS."
            exit "$START_STATUS"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|Invalid call|Invalid get index" "$GODOT_DIR/startup.log"; then
            echo "Godot runtime validation found script errors."
            exit 1
          fi

      - name: Fetch optional CC0 vehicle art
        shell: bash
        run: python3 tools/fetch_free_assets.py

      - name: Fetch optional CC0 city building art
        shell: bash
        run: python3 tools/fetch_city_assets.py

      - name: Fetch optional Poly Haven CC0 high-resolution PBR surfaces
        shell: bash
        run: python3 tools/fetch_polyhaven_pbr.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'

      - name: Prepare stable signing configuration
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "WSB_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "WSB_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "WSB_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "WSB_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "WSB_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/godot-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=World Sandbox Development,O=World Sandbox,C=BD"
            echo "WSB_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "WSB_KEYSTORE=$RUNNER_TEMP/godot-debug.keystore" >> "$GITHUB_ENV"
            echo "WSB_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "WSB_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "WSB_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$WSB_KEYSTORE"
          export/android/debug_keystore_user = "$WSB_KEY_ALIAS"
          export/android/debug_keystore_pass = "$WSB_STORE_PASSWORD"
          EOF

      - name: Export Godot Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/godot-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: build
          presets_to_export: Android
          export_debug: true
          verbose: true

      - name: Verify exported APK integrity and record checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' ! -path 'build/canonical_release/*' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          # The Godot export can leave this APK without a usable Android signature.
          # Sign the exported file with the configured stable keystore before verifying it.
          "$APKSIGNER" sign --ks "$WSB_KEYSTORE" --ks-key-alias "$WSB_KEY_ALIAS" --ks-pass "pass:$WSB_STORE_PASSWORD" --key-pass "pass:$WSB_KEY_PASSWORD" "$APK"
          echo "APK_PATH=$APK"
          echo "APK_BYTES=$(stat -c '%s' "$APK")"
          sha256sum "$APK" | tee build/apk-sha256.txt
          unzip -t "$APK" > build/apk-zip-test.txt
          cat build/apk-zip-test.txt
          # Verify schemes applicable to Android 7+; fail on a genuine APK signature problem.
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 --max-sdk-version 35 "$APK" | tee build/apk-signature-verification.txt
          APK_BASENAME="$(basename "$APK")"
          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          {
            printf '## APK integrity verification\n\n'
            printf -- '- File: `%s`\n' "$APK_BASENAME"
            printf -- '- Size (bytes): `%s`\n' "$APK_SIZE"
            printf -- '- SHA-256: `%s`\n' "$APK_SHA256"
            printf -- '- ZIP structure test: PASS\n'
            printf -- '- Android signature verification: PASS\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify selected map and core art are embedded in the exported APK
        shell: bash
        env:
          MAP_PACKAGE: ${{ (inputs.map_package == 'shariatpur_review' || github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shariatpur-review-apk]'))) && 'shariatpur_review' || 'greater_dhaka' }}
        run: |
          set -euo pipefail
          python3 tools/verify_apk_contents.py --apk build/Android/world_sandbox_bangladesh.apk --map-package "$MAP_PACKAGE" | tee build/apk-content-verification.txt
          cat build/apk-content-verification.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Report exact APK and included asset sizes
        shell: bash
        run: python3 tools/report_build_assets.py

      - name: Assemble one canonical installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/canonical_release
          APK_SOURCE="build/Android/world_sandbox_bangladesh.apk"
          test -s "$APK_SOURCE"
          cp "$APK_SOURCE" build/canonical_release/Project-A-Square.apk
          test "$(find build/canonical_release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find build/canonical_release -maxdepth 1 -type f | wc -l)" -eq 1
          # Hash, signature, content and asset reports stay in the separate
          # verification artifact below; never mix them into the game package.
          ls -lh build/canonical_release/Project-A-Square.apk

      - name: Upload single installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.map_package == 'shariatpur_review' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shariatpur-review-apk]')) || (github.event_name == 'pull_request' && github.head_ref == 'feature/real-world-navigation-floor-fidelity-verified')) && 'Project-A-Square-Shariatpur-APK' || 'Project-A-Square-Android-APK' }}
          path: build/canonical_release/Project-A-Square.apk
          if-no-files-found: error

      - name: Publish direct APK download (no artifact ZIP wrapper)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[shariatpur-review-apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-dev
          name: "World Sandbox: Bangladesh — Android Development Build"
          body: |
            Automatically generated Android development build from the canonical main branch.
            This is a direct APK download, not a GitHub Actions artifact ZIP.
            APK ZIP integrity and Android signature verification must pass before this release step.
            This is an in-progress development build; physical-device gameplay and performance are not yet certified.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/Android/world_sandbox_bangladesh.apk

      - name: Publish direct Shariatpur review APK (separate from canonical release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[shariatpur-review-apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shariatpur-review
          name: "World Sandbox: Bangladesh — Shariatpur Review Candidate"
          body: |
            This is a direct APK candidate built with the latest assembled Shariatpur district map package.
            It is intentionally separate from the canonical Android development release.
            The map quality gate remains REVIEW_REQUIRED; photorealistic facade imagery, complete surveyed building heights, manual visual review, and physical-device gameplay/performance checks are not yet certified.
            Do not treat this candidate as the final dream game or as a production release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/Android/world_sandbox_bangladesh.apk

      # Manual Shariatpur review builds need a directly installable APK too.
      # GitHub Actions artifacts are ZIP containers; this release asset is the APK itself.
      - name: Publish direct Shariatpur dispatch candidate APK
        if: github.event_name == 'workflow_dispatch' && inputs.map_package == 'shariatpur_review' && steps.map-selection.outputs.source_branch == github.ref_name
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shariatpur-review-candidate
          target_commitish: ${{ github.sha }}
          name: "World Sandbox: Bangladesh — Shariatpur Review Candidate"
          body: |
            Direct Android APK candidate built by manually dispatched workflow run ${{ github.run_id }}.
            Source branch: ${{ github.ref_name }}
            Source commit: ${{ github.sha }}
            This is a review build, not a completed dream-game release. The Shariatpur gate remains REVIEW_REQUIRED until the map, visual fidelity, and physical-device checks pass.
            APK signature and ZIP structure are checked by CI; gameplay and performance still require physical-device testing.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/Android/world_sandbox_bangladesh.apk

      # The pull-request artifact is a ZIP; publish the verified APK file itself as a replaceable preview asset.
      - name: Publish direct Shariatpur pull-request APK preview
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/real-world-navigation-floor-fidelity-verified' && steps.map-selection.outputs.source_branch == github.head_ref
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shariatpur-review-candidate
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "World Sandbox: Bangladesh — Shariatpur Direct APK Preview"
          body: |
            Direct APK preview generated from the Project A-Square Shariatpur development branch.
            The APK-content integration gate, APK ZIP integrity test, and Android signature verification must pass before this release step runs.
            The package contains the current Shariatpur review map, not a production-approved map. Floor-count verification, visual facade review, and physical-device gameplay/performance QA remain incomplete.
            Preview source commit: ${{ github.event.pull_request.head.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/Android/world_sandbox_bangladesh.apk

      - name: Upload small verification reports separately
        uses: actions/upload-artifact@v4
        with:
          name: WorldSandboxBangladesh-Verification-Reports
          path: |
            build/apk-sha256.txt
            build/apk-zip-test.txt
            build/apk-signature-verification.txt
            build/apk-content-verification.txt
            build/asset_build_report.json
          if-no-files-found: error
