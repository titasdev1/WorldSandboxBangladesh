name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/osm-real-world-foundation ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run production preflight gate
        shell: bash
        run: python3 tools/production_gate.py

      - name: Validate asset pipeline Python syntax
        shell: bash
        run: python3 -m py_compile tools/fetch_dhaka_map.py tools/fetch_free_assets.py tools/fetch_city_assets.py tools/fetch_polyhaven_pbr.py tools/report_build_assets.py tests/test_fetch_dhaka_map.py

      - name: Test OSM conversion without network access
        shell: bash
        run: python3 -m unittest tests.test_fetch_dhaka_map -v

      - name: Install OSM PBF processing fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Fetch optional real Dhaka road/building data
        shell: bash
        run: python3 tools/fetch_dhaka_map.py

      - name: Fetch optional rigged CC0 humanoid character
        shell: bash
        run: python3 tools/fetch_character_model.py

      - name: Validate Godot project scripts and startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot-validation"
          mkdir -p "$GODOT_DIR"
          curl -L --fail --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          GODOT="$GODOT_DIR/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          set +e
          "$GODOT" --headless --editor --path . --quit > "$GODOT_DIR/import.log" 2>&1
          IMPORT_STATUS=$?
          cat "$GODOT_DIR/import.log"
          set -e
          if [ "$IMPORT_STATUS" -ne 0 ] || grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|Parse failed" "$GODOT_DIR/import.log"; then
            echo "Godot editor/import validation failed."
            exit 1
          fi
          set +e
          timeout 30s "$GODOT" --headless --path . --quit-after 120 > "$GODOT_DIR/startup.log" 2>&1
          START_STATUS=$?
          cat "$GODOT_DIR/startup.log"
          set -e
          if [ "$START_STATUS" -ne 0 ] && [ "$START_STATUS" -ne 124 ]; then
            echo "Godot headless startup exited with status $START_STATUS."
            exit "$START_STATUS"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|Invalid call|Invalid get index|Parse failed" "$GODOT_DIR/startup.log"; then
            echo "Godot runtime validation found script errors."
            exit 1
          fi

      - name: Fetch optional CC0 vehicle art
        shell: bash
        run: python3 tools/fetch_free_assets.py

      - name: Fetch optional CC0 city building art
        shell: bash
        run: python3 tools/fetch_city_assets.py

      - name: Fetch optional Poly Haven CC0 high-resolution PBR surfaces
        shell: bash
        run: python3 tools/fetch_polyhaven_pbr.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'

      - name: Prepare stable signing configuration
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "WSB_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "WSB_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "WSB_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "WSB_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "WSB_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/godot-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=World Sandbox Development,O=World Sandbox,C=BD"
            echo "WSB_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            echo "WSB_KEYSTORE=$RUNNER_TEMP/godot-debug.keystore" >> "$GITHUB_ENV"
            echo "WSB_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "WSB_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "WSB_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$WSB_KEYSTORE"
          export/android/debug_keystore_user = "$WSB_KEY_ALIAS"
          export/android/debug_keystore_pass = "$WSB_STORE_PASSWORD"
          EOF

      - name: Export Godot Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/godot-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: build
          presets_to_export: Android
          export_debug: true
          verbose: true

      - name: Verify exported APK integrity and record checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' ! -path 'build/canonical_release/*' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          # The Godot export can leave this APK without a usable Android signature.
          # Sign the exported file with the configured stable keystore before verifying it.
          "$APKSIGNER" sign --ks "$WSB_KEYSTORE" --ks-key-alias "$WSB_KEY_ALIAS" --ks-pass "pass:$WSB_STORE_PASSWORD" --key-pass "pass:$WSB_KEY_PASSWORD" "$APK"
          echo "APK_PATH=$APK"
          echo "APK_BYTES=$(stat -c '%s' "$APK")"
          sha256sum "$APK" | tee build/apk-sha256.txt
          unzip -t "$APK" > build/apk-zip-test.txt
          cat build/apk-zip-test.txt
          # Verify schemes applicable to Android 7+; fail on a genuine APK signature problem.
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 --max-sdk-version 35 "$APK" | tee build/apk-signature-verification.txt
          {
            echo "## APK integrity verification"
            echo
            echo "- File: `$(basename "$APK")`"
            echo "- Size (bytes): `$(stat -c '%s' "$APK")`"
            echo "- SHA-256: `$(sha256sum "$APK" | cut -d ' ' -f 1)`"
            echo "- ZIP structure test: PASS"
            echo "- Android signature verification: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report exact APK and included asset sizes
        shell: bash
        run: python3 tools/report_build_assets.py

      - name: Assemble one canonical build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/canonical_release
          find build -type f -name '*.apk' ! -path 'build/canonical_release/*' -exec cp {} build/canonical_release/ \;
          test -n "$(find build/canonical_release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp build/asset_build_report.json build/canonical_release/ASSET_BUILD_REPORT.json
          cp build/apk-sha256.txt build/canonical_release/APK_SHA256.txt
          cp build/apk-zip-test.txt build/canonical_release/APK_ZIP_TEST.txt
          cp build/apk-signature-verification.txt build/canonical_release/APK_SIGNATURE_VERIFICATION.txt
          cat > build/canonical_release/README.txt <<'EOF'
          World Sandbox: Bangladesh / Project A-Square
          This artifact contains the Android APK and verification reports.
          Before publishing, CI tests the APK ZIP structure and Android signature.
          Compare the extracted APK SHA-256 against APK_SHA256.txt.
          The JSON report is build metadata, not a second game.
          Artifact-container size and APK file size are different measurements.
          EOF
          ls -lh build/canonical_release

      - name: Upload canonical game artifact (APK + verification reports)
        uses: actions/upload-artifact@v4
        with:
          name: WorldSandboxBangladesh-Canonical-Build
          path: build/canonical_release/*
          if-no-files-found: error

      - name: Publish direct APK download (no artifact ZIP wrapper)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-dev
          name: "World Sandbox: Bangladesh — Android Development Build"
          body: |
            Automatically generated Android development build from the canonical main branch.
            This is a direct APK download, not a GitHub Actions artifact ZIP.
            APK ZIP integrity and Android signature verification must pass before this release step.
            This is an in-progress development build; physical-device gameplay and performance are not yet certified.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/Android/world_sandbox_bangladesh.apk

      - name: Publish direct APK download for development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/osm-real-world-foundation'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-dev-feature
          name: "World Sandbox: Bangladesh — Development Branch APK"
          body: |
            Direct APK for the latest successful push build of feature/osm-real-world-foundation.
            This is the same canonical Godot project and Android pipeline, not a separate game.
            It is a development preview, not a finished or device-certified release.
            Automated APK integrity and Android signature checks run before publishing.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/Android/world_sandbox_bangladesh.apk

      - name: Upload small verification reports separately
        uses: actions/upload-artifact@v4
        with:
          name: WorldSandboxBangladesh-Verification-Reports
          path: |
            build/apk-sha256.txt
            build/apk-zip-test.txt
            build/apk-signature-verification.txt
            build/asset_build_report.json
          if-no-files-found: error
