name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'

      - name: Create Godot debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/godot-debug.keystore"             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Inject CI Android signing settings into export preset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = s.replace('package/signed=false', 'package/signed=true')
          s = s.replace('gradle_build/min_sdk=""', 'gradle_build/min_sdk="24"')
          s = s.replace('gradle_build/target_sdk=""', 'gradle_build/target_sdk="34"')
          nl = chr(10)
          s = s.replace('package/app_category=2', 'keystore/debug="${RUNNER_TEMP}/godot-debug.keystore"' + nl + 'keystore/debug_user="androiddebugkey"' + nl + 'keystore/debug_password="android"' + nl + 'keystore/release=""' + nl + 'keystore/release_user=""' + nl + 'keystore/release_password=""' + nl + 'package/app_category=2')
          p.write_text(s)
          PY
          echo "=== Android preset used by CI ==="
          sed -n '/\[preset.0.options\]/,$p' export_presets.cfg

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/godot-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Godot Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/godot-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: build
          presets_to_export: Android
          export_debug: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldSandboxBangladesh-Android
          path: build/**/*.apk
