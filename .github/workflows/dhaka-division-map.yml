name: Build Dhaka Division Real-World 3D Map

on:
  workflow_dispatch:
    inputs:
      tile_degrees:
        description: "Tile edge in degrees (larger tiles build faster)"
        required: true
        default: "0.05"
        type: choice
        options: ["0.03", "0.05", "0.08"]
      max_tiles:
        description: "Test limit (0 builds all boundary-intersecting tiles)"
        required: true
        default: "0"
        type: string
  push:
    branches: [feature/dhaka-division-map-foundation]
    paths:
      - "tools/map_pipeline/build_dhaka_division.py"
      - "tools/map_pipeline/build_dhaka_map.py"
      - "tools/map_pipeline/tile_grid.py"
      - ".github/workflows/dhaka-division-map.yml"

permissions:
  contents: read

concurrency:
  group: dhaka-division-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install map pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium shapely trimesh mapbox-earcut
      - name: Validate scripts and existing map fixtures
        run: |
          python -m py_compile tools/map_pipeline/build_dhaka_map.py tools/map_pipeline/build_dhaka_division.py tools/map_pipeline/tile_grid.py
          python -m unittest discover -s tests -p 'test_dhaka_map_pipeline.py' -v
      - name: Build boundary-clipped Dhaka Division tiles
        run: |
          python tools/map_pipeline/build_dhaka_division.py \
            --tile-degrees "${{ inputs.tile_degrees || '0.05' }}" \
            --max-tiles "${{ inputs.max_tiles || '0' }}" \
            --out build/dhaka-division
      - name: Verify map package and administrative coverage metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/dhaka-division")
          manifest = json.loads((root / "map_tiles_manifest.json").read_text())
          glbs = list(root.rglob("Dhaka_Explorable_Map.glb"))
          if not glbs:
              raise SystemExit("No GLB tiles were produced")
          if len(glbs) != manifest["tile_count_with_geometry"]:
              raise SystemExit("Manifest GLB count mismatch")
          if manifest.get("administrative_boundary", {}).get("name") != "Dhaka Division":
              raise SystemExit("Administrative boundary metadata is missing")
          if not (root / "ATTRIBUTION.txt").is_file():
              raise SystemExit("Required attribution is missing")
          print(json.dumps({
            "boundary": manifest["administrative_boundary"]["name"],
            "boundary_bbox": manifest["region_south_west_north_east"],
            "tiles_intersecting_boundary": manifest["tile_count_intersecting_boundary"],
            "tiles_with_geometry": len(glbs),
            "source_elements_in_boundary_envelope": manifest["source_elements_in_boundary_envelope"],
            "glb_bytes": sum(p.stat().st_size for p in glbs),
          }, indent=2))
          PY
      - name: Upload Dhaka Division map package
        uses: actions/upload-artifact@v4
        with:
          name: Project-A-Square-Dhaka-Division-3D-Map
          path: build/dhaka-division/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
