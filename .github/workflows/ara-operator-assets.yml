name: Build Ara 3D Gen Operator Assets

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lobby-operator-showcase
      - feature/three-distinct-ara-operators
    paths:
      - "tools/ara3d/**"
      - ".github/workflows/ara-operator-assets.yml"
      - "tests/test_ara3d_operator_integration.py"

permissions:
  contents: read

concurrency:
  group: ara-operator-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-operator:
    name: Generate and validate three distinct rigged operators
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Project A-Square
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch pinned Ara 3D Gen source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/olatunde85/3d-gen.git "$RUNNER_TEMP/ara-3d-gen"
          git -C "$RUNNER_TEMP/ara-3d-gen" checkout 4122e90633fda0384c6611115b64a15102e5463d
          echo "ARA_SOURCE=$RUNNER_TEMP/ara-3d-gen" >> "$GITHUB_ENV"

      - name: Install Ara 3D Gen dependencies
        working-directory: ${{ runner.temp }}/ara-3d-gen
        run: npm ci

      - name: Download and build licensed character source data
        working-directory: ${{ runner.temp }}/ara-3d-gen
        run: npm run setup-assets

      - name: Generate high, medium and low GLBs for all three distinct operators
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/ara_operator"
          mkdir -p "$OUT"
          for PROFILE in "$GITHUB_WORKSPACE"/tools/ara3d/profiles/*.json; do
            OPERATOR_ID="$(basename "$PROFILE" .json)"
            echo "Generating independent operator profile: $OPERATOR_ID"
            for DETAIL in high medium low; do
              mkdir -p "$OUT/$OPERATOR_ID/$DETAIL"
              npm --prefix "$ARA_SOURCE" run export -- \
                --params "$PROFILE" \
                --out "$OUT/$OPERATOR_ID/$DETAIL" \
                --formats glb \
                --detail "$DETAIL"
            done
          done

      - name: Verify each rig, all LODs and distinct baked character geometry
        shell: bash
        run: |
          set -euo pipefail
          find build/ara_operator -type f -name '*.glb' -print
          python3 tools/ara3d/verify_ara_roster.py \
            --root build/ara_operator \
            --roster tools/ara3d/roster.json \
            --out build/ara_operator/roster_manifest.json

      - name: Run Ara3D pipeline integration regression tests
        shell: bash
        run: python3 -m unittest discover -s tests -p "test_ara3d_operator_integration.py" -v

      - name: Install checksum-verified Blender 5.2.4 LTS
        shell: bash
        run: |
          set -euo pipefail
          source tools/install_blender_ci.sh
          blender --version

      - name: Render separate inspectable contact sheets for all operators
        shell: bash
        run: |
          set -euo pipefail
          for OPERATOR_ID in field_ranger delta_recon river_scout; do
            ROOT="build/ara_operator/$OPERATOR_ID"
            HIGH="$(find "$ROOT/high" -maxdepth 1 -type f -name '*.glb' -print -quit)"
            MEDIUM="$(find "$ROOT/medium" -maxdepth 1 -type f -name '*.glb' -print -quit)"
            LOW="$(find "$ROOT/low" -maxdepth 1 -type f -name '*.glb' -print -quit)"
            test -s "$HIGH" && test -s "$MEDIUM" && test -s "$LOW"
            mkdir -p "$ROOT/previews"
            blender --background --factory-startup --python tools/ara3d/render_operator_contact_sheet.py -- \
              --high "$HIGH" --medium "$MEDIUM" --low "$LOW" \
              --out-dir "$ROOT/previews"
            test -s "$ROOT/previews/operator_lod_front.png"
            test -s "$ROOT/previews/operator_lod_three_quarter.png"
            test -s "$ROOT/previews/preview_report.json"
          done

      - name: Record source and asset licences
        shell: bash
        run: |
          cat > build/ara_operator/ASSET-LICENSES.txt <<'EOF'
          Ara 3D Gen source: https://github.com/olatunde85/3d-gen
          Pinned source commit: 4122e90633fda0384c6611115b64a15102e5463d
          Generator source code: MIT License.
          MakeHuman character mesh, morph targets, skins, hair, clothing and proxies: CC0 1.0.
          CMU motion capture: Graphics Lab Motion Capture Database; may be used in commercial products, must not be resold as a standalone converted motion asset. See upstream scripts/ASSETS_LICENSE.txt.
          This three-operator roster is a generated asset candidate. Each identity has a separate profile and baked vertex-position hash. Blender contact sheets are supplied for human review; they are not automatic art approval or Android-device QA.
          EOF

      - name: Upload validated character candidates
        uses: actions/upload-artifact@v4
        with:
          name: A-Square-Ara3D-Operator-Candidates
          path: |
            build/ara_operator/*/high/*.glb
            build/ara_operator/*/medium/*.glb
            build/ara_operator/*/low/*.glb
            build/ara_operator/*/previews/*.png
            build/ara_operator/*/previews/preview_report.json
            build/ara_operator/roster_manifest.json
            build/ara_operator/ASSET-LICENSES.txt
          if-no-files-found: error
          retention-days: 14
