name: Audit Shariatpur open aerial imagery

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lobby-operator-showcase
    paths:
      - "tools/audit_openaerialmap_coverage.py"
      - "tests/test_audit_openaerialmap_coverage.py"
      - ".github/workflows/audit-shariatpur-aerial-imagery.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/audit_openaerialmap_coverage.py"
      - "tests/test_audit_openaerialmap_coverage.py"
      - ".github/workflows/audit-shariatpur-aerial-imagery.yml"

permissions:
  contents: read

concurrency:
  group: shariatpur-aerial-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run offline audit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_openaerialmap_coverage.py
          python3 -m unittest discover -s tests -p "test_audit_openaerialmap_coverage.py" -v
      - name: Query all HOTOSM STAC imagery collections for Shariatpur
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_openaerialmap_coverage.py --out build/shariatpur_openaerialmap_audit.json
      - name: Upload machine-readable coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: Shariatpur-OpenAerialMap-Coverage-Audit
          path: build/shariatpur_openaerialmap_audit.json
          if-no-files-found: error
          retention-days: 30
