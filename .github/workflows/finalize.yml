name: Final Game Project Archive

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical project
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch licensed CC0 vehicle and city assets into the deliverable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fetch_free_assets.py tools/fetch_city_assets.py tools/fetch_polyhaven_pbr.py
          python3 tools/fetch_free_assets.py
          python3 tools/fetch_city_assets.py
          python3 tools/fetch_polyhaven_pbr.py
          echo "Licensed authored asset payload included in the project archive:"
          du -sh external_content || true
          find external_content -type f | wc -l

      - name: Verify finalization state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("development_state.json").read_text())
          if state.get("finalization_status") != "ready":
              raise SystemExit("Final archive blocked: development_state.json is not marked ready.")
          print("Finalization state is READY.")
          PY

      - name: Create one canonical project ZIP
        shell: bash
        run: |
          rm -rf archive_stage
          mkdir archive_stage
          rsync -a --exclude='.git' --exclude='archive_stage' --exclude='FINAL_GAME_PROJECT.zip' --exclude='*.zip' ./ archive_stage/
          cd archive_stage
          zip -9 -r ../FINAL_GAME_PROJECT.zip .
          cd ..
          sha256sum FINAL_GAME_PROJECT.zip
          du -h FINAL_GAME_PROJECT.zip
          python3 - <<'PY'
          import json, pathlib, zipfile
          archive = pathlib.Path("FINAL_GAME_PROJECT.zip")
          with zipfile.ZipFile(archive) as z:
              assets = [n for n in z.namelist() if n.startswith("external_content/")]
          report = {"archive_bytes": archive.stat().st_size, "licensed_asset_files": len(assets), "asset_paths_sample": assets[:12]}
          pathlib.Path("archive_manifest.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload final ZIP as a single file
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_GAME_PROJECT
          path: FINAL_GAME_PROJECT.zip
          archive: false
          compression-level: 0
          retention-days: 90
