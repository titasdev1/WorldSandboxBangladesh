name: Validate authored login and lobby art

on:
  push:
    branches:
      - feature/three-distinct-ara-operators
    paths:
      - "tools/blender/build_login_lobby_environments.py"
      - "tools/blender/verify_login_lobby_environments.py"
      - "tools/fetch_polyhaven_pbr.py"
      - "tools/install_blender_ci.sh"
      - "tools/fetch_polyhaven_pbr.py"
      - ".github/workflows/validate-lobby-art.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: authored-lobby-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Project A-Square
        uses: actions/checkout@v5

      - name: Cache Blender 5.2.4 LTS
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.2.4
          key: blender-linux-5.2.4-lts

      - name: Install checksum-verified Blender 5.2.4 LTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils python3-numpy xvfb libgl1-mesa-dri libegl1 libglx-mesa0
          bash -n tools/install_blender_ci.sh
          source tools/install_blender_ci.sh
          blender --version

      - name: Compile Blender authoring and verifier scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/blender/build_login_lobby_environments.py \
            tools/blender/verify_login_lobby_environments.py

      - name: Resolve and download the validated Field Ranger rig for lobby art review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          CURRENT_ROSTER_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/tools/ara3d/roster.json?ref=${BRANCH}" --jq '.sha // empty')"
          if [[ -z "$CURRENT_ROSTER_SHA" ]]; then
            echo "Could not resolve the current operator roster blob." >&2
            exit 1
          fi
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&per_page=100" \
              --jq '.workflow_runs | map(select(.workflow_id == 417330351 and .head_branch == "'"${BRANCH}"'" and .status == "completed" and .conclusion == "success")) | sort_by(.created_at) | reverse | .[0:30][] | [.id, .head_sha] | @tsv' \
              || true)"
            while IFS=$'\t' read -r CANDIDATE_ID CANDIDATE_SHA; do
              [[ -n "${CANDIDATE_ID:-}" && -n "${CANDIDATE_SHA:-}" ]] || continue
              CANDIDATE_ROSTER_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/tools/ara3d/roster.json?ref=${CANDIDATE_SHA}" --jq '.sha // empty' || true)"
              if [[ "$CANDIDATE_ROSTER_SHA" == "$CURRENT_ROSTER_SHA" ]]; then
                RUN_ID="$CANDIDATE_ID"
                break
              fi
            done <<< "$RUNS"
            [[ -n "$RUN_ID" ]] && break
            echo "Waiting for a successful Ara3D run matching roster $CURRENT_ROSTER_SHA."
            sleep 15
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No validated Ara3D artifact matches the current operator roster." >&2
            exit 1
          fi
          mkdir -p build/ara-operator
          gh run download "$RUN_ID" --name A-Square-Ara3D-Operator-Candidates --dir build/ara-operator
          OPERATOR_GLB="$(find build/ara-operator/field_ranger/high -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -s "$OPERATOR_GLB"
          echo "FIELD_RANGER_GLB=$OPERATOR_GLB"
          echo "Ara workflow run: $RUN_ID"
          echo "Roster blob: $CURRENT_ROSTER_SHA"

      - name: Fetch original CC0 PBR surfaces within the mobile resolution budget
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fetch_polyhaven_pbr.py
          python3 tools/fetch_polyhaven_pbr.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("external_content/polyhaven_pbr/asset_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("license") != "CC0-1.0" or manifest.get("available") is not True:
              raise SystemExit("POLYHAVEN_PBR_GATE: no verified CC0 surface maps were downloaded.")
          surfaces = manifest.get("surfaces", {})
          required = {"road", "brick", "concrete", "plaster"}
          missing = sorted(required - set(surfaces))
          if missing:
              raise SystemExit(f"POLYHAVEN_PBR_GATE: required authored surfaces missing: {missing}")
          for surface, entry in surfaces.items():
              maps = entry.get("maps", {})
              if "albedo" not in maps:
                  raise SystemExit(f"POLYHAVEN_PBR_GATE: {surface} is missing albedo.")
          print("POLYHAVEN_PBR_GATE:PASS", json.dumps({
              "surface_count": len(surfaces),
              "surfaces": sorted(surfaces),
              "channels": sorted({channel for entry in surfaces.values() for channel in entry.get("maps", {})}),
              "resolution_policy": manifest.get("resolution_policy", ""),
              "license": manifest["license"],
          }, sort_keys=True))
          PY


      - name: Build and render Shariatpur login environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/lobby-art
          if ! xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 blender --background --factory-startup \
            --python tools/blender/build_login_lobby_environments.py -- \
            --kind login \
            --operator-glb "$(find build/ara-operator/field_ranger/high -maxdepth 1 -type f -name '*.glb' -print -quit)" \
            --out build/lobby-art/a_square_login_riverside.glb \
            --preview build/lobby-art/a_square_login_riverside.png \
            > build/lobby-art/login-authoring.log 2>&1; then
            cat build/lobby-art/login-authoring.log
            exit 1
          fi
          cat build/lobby-art/login-authoring.log
          test -s build/lobby-art/a_square_login_riverside.glb
          test -s build/lobby-art/a_square_login_riverside.png
          python3 tools/blender/verify_login_lobby_environments.py \
            --kind login \
            --glb build/lobby-art/a_square_login_riverside.glb \
            --out build/lobby-art/login-verification.json

      - name: Preserve login scene candidate for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-Square-Login-Scene-Candidate
          path: |
            build/lobby-art/a_square_login_riverside.glb
            build/lobby-art/a_square_login_riverside.png
            build/lobby-art/login-verification.json
            build/lobby-art/login-authoring.log
          if-no-files-found: ignore

      - name: Build and render Delta Command lobby environment
        shell: bash
        run: |
          set -euo pipefail
          if ! xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 blender --background --factory-startup \
            --python tools/blender/build_login_lobby_environments.py -- \
            --kind lobby \
            --operator-glb "$(find build/ara-operator/field_ranger/high -maxdepth 1 -type f -name '*.glb' -print -quit)" \
            --out build/lobby-art/a_square_delta_command_lobby.glb \
            --preview build/lobby-art/a_square_delta_command_lobby.png \
            > build/lobby-art/lobby-authoring.log 2>&1; then
            cat build/lobby-art/lobby-authoring.log
            exit 1
          fi
          cat build/lobby-art/lobby-authoring.log
          test -s build/lobby-art/a_square_delta_command_lobby.glb
          test -s build/lobby-art/a_square_delta_command_lobby.png
          python3 tools/blender/verify_login_lobby_environments.py \
            --kind lobby \
            --glb build/lobby-art/a_square_delta_command_lobby.glb \
            --out build/lobby-art/lobby-verification.json

      - name: Record original asset licence and manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > build/lobby-art/ASSET-LICENSES.txt <<'EOF'
          PROJECT A-SQUARE ORIGINAL ENVIRONMENT ART
          Original meshes, material setups and animation curves:
          CC0 1.0 Universal. Authoring source: tools/blender/build_login_lobby_environments.py
          Embedded Poly Haven PBR images: CC0 1.0 Universal; exact source asset IDs,
          source URLs and downloaded channels are recorded in asset_manifest.json.
          No game rips, commercial-game assets, logos, street-view images or map-provider 3D tiles.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/lobby-art")
          manifest = {
              "schema_version": 1,
              "source_branch": "${{ github.ref_name }}",
              "source_commit": "${{ github.sha }}",
              "license": "CC0-1.0",
              "assets": [
                  json.loads((root / "login-verification.json").read_text()),
                  json.loads((root / "lobby-verification.json").read_text()),
              ],
              "status": "STRUCTURAL_PASS_REQUIRES_GODOT_IMPORT_AND_ANDROID_DEVICE_REVIEW",
          }
          if any(item["status"] != "PASS" for item in manifest["assets"]):
              raise SystemExit("Lobby art build manifest contains a failed scene gate")
          (root / "lobby_art_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload inspectable Blender source previews and GLB candidates
        uses: actions/upload-artifact@v4
        with:
          name: A-Square-Authored-Login-Lobby-Art
          path: |
            build/lobby-art/*.glb
            build/lobby-art/*.png
            build/lobby-art/*.json
            build/lobby-art/*.txt
            build/lobby-art/*-authoring.log
            external_content/polyhaven_pbr/asset_manifest.json
          if-no-files-found: error
