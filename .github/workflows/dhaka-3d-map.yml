# Assembly retry for Shariatpur sequence 39059651141 uses retained batch artifacts.
name: Build Dhaka Division Real-World 3D Map

on:
  workflow_dispatch:
    inputs:
      tile_degrees:
        description: "Tile edge in degrees (larger tiles build faster)"
        required: true
        default: "0.05"
        type: choice
        options: ["0.03", "0.05", "0.08"]
      tile_offset:
        description: "Batch offset in the complete Dhaka Division tile order (0 starts near Shariatpur)"
        required: true
        default: "0"
        type: string
      max_tiles:
        description: "Tiles per batch; each batch has its own under-six-hour workflow run"
        required: true
        default: "8"
        type: string
      build_stage:
        description: "Build Shariatpur first and pause for polish/review; full division must be explicitly approved"
        required: true
        default: "shariatpur_review"
        type: choice
        options: ["shariatpur_review", "full_division"]
      continue_full_division:
        description: "Automatically dispatch the next batch within the selected build stage"
        required: true
        default: true
        type: boolean
      sequence_id:
        description: "Internal ID that ties sequential batch artifacts together"
        required: false
        default: ""
        type: string
      source_commit:
        description: "Pinned source commit shared by every batch in this sequence"
        required: false
        default: ""
        type: string
      assemble_only:
        description: "Assemble an already completed Shariatpur batch sequence without rebuilding tiles"
        required: false
        default: false
        type: boolean
      retry_count:
        description: "Internal bounded retry counter for a failed batch"
        required: false
        default: "0"
        type: string
  pull_request:
    paths:
      - "tools/map_pipeline/**"
      - "tests/test_dhaka_map_pipeline.py"
      - "tests/test_dhaka_division_pipeline.py"
      - "tests/test_merge_dhaka_division_batches.py"
      - ".github/workflows/dhaka-3d-map.yml"
      - ".github/workflows/dhaka-division-map.yml"
      - "MAP_PIPELINE.md"
  push:
    branches: [main, "feature/real-world-navigation-floor-fidelity-verified"]
    paths:
      - "tools/map_pipeline/**"
      - "tests/test_dhaka_map_pipeline.py"
      - "tests/test_dhaka_division_pipeline.py"
      - ".github/workflows/dhaka-3d-map.yml"
      - ".github/workflows/dhaka-division-map.yml"
      - "MAP_PIPELINE.md"

permissions:
  actions: write
  contents: read

concurrency:
  group: dhaka-division-map-v2-${{ github.ref }}-${{ inputs.sequence_id || (github.event_name == 'pull_request' && 'pr-check') || github.run_id }}
  # A newer PR revision supersedes an old bounded build; chained batches are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-map:
    if: ${{ !inputs.assemble_only && github.event_name != 'pull_request' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[assemble-shariatpur-review:')) && (github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[build-shariatpur-review]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      next_offset: ${{ steps.batch-meta.outputs.next_offset }}
      total_tiles: ${{ steps.batch-meta.outputs.total_tiles }}
      sequence_id: ${{ inputs.sequence_id || github.run_id }}
      source_commit: ${{ inputs.source_commit || github.sha }}
      tile_degrees: ${{ inputs.tile_degrees || '0.05' }}
      max_tiles: ${{ inputs.max_tiles || (github.event_name == 'workflow_dispatch' && '8' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-shariatpur-review]') && '8' || '2')) }}
      build_stage: ${{ inputs.build_stage || 'shariatpur_review' }}
      stage_gate_reached: ${{ steps.batch-meta.outputs.stage_gate_reached }}
    steps:
      - name: Checkout pinned source commit for this map sequence
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Reject unpinned continuation batches
        if: ${{ inputs.continue_full_division && inputs.sequence_id != '' && inputs.source_commit == '' }}
        run: |
          echo "Continuation batch lacks its original source_commit; refusing to mix map pipeline versions." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install geometry and OSM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          python -m pip install osmium shapely trimesh mapbox-earcut pillow

      # Cache a regional extract, not the full country PBF. This prevents each
      # tile batch from scanning the entire Bangladesh extract from scratch.
      # Bump the v1 key only when intentionally refreshing the source map data.
      - name: Restore cached Dhaka Division OSM extract
        id: regional-pbf-cache
        uses: actions/cache@v4
        with:
          path: build/osm/dhaka-division-envelope.osm.pbf
          key: dhaka-division-osm-pbf-filtered-v2

      - name: Prepare regional OSM extract on cache miss
        if: steps.regional-pbf-cache.outputs.cache-hit != 'true'
        run: |
          python tools/map_pipeline/prepare_dhaka_division_pbf.py --out build/osm/dhaka-division-envelope.osm.pbf

      - name: Validate Python syntax and offline fixtures
        run: |
          python -m py_compile tools/map_pipeline/build_dhaka_map.py tools/map_pipeline/build_dhaka_division.py tools/map_pipeline/prepare_dhaka_division_pbf.py tools/map_pipeline/merge_dhaka_division_batches.py tools/map_pipeline/tile_grid.py tools/map_pipeline/build_real_world_navigation_index.py tools/map_pipeline/fetch_licensed_facade_images.py
          python -m unittest discover -s tests -p 'test_dhaka*_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_merge_dhaka_division_batches.py' -v

      - name: Fetch allowlisted Shariatpur landmark facade photos
        shell: bash
        run: |
          # The source commit may predate the Wikimedia thumbnail-host allowlist;
          # patch the checked-out helper for this build without changing map geometry.
          python - <<'PY'
          from pathlib import Path
          helper = Path("tools/map_pipeline/fetch_licensed_facade_images.py")
          source = helper.read_text(encoding="utf-8")
          source = source.replace('"upload.wikimedia.org"}', '"upload.wikimedia.org", "thumb.wikimedia.org"}')
          helper.write_text(source, encoding="utf-8")
          PY
          python tools/map_pipeline/fetch_licensed_facade_images.py \
            --catalog tools/map_pipeline/shariatpur_facade_images.json \
            --out build/facade-images \
            --allow-missing

      - name: Build boundary-clipped Dhaka Division tiles
        env:
          WSB_PIPELINE_COMMIT_SHA: ${{ inputs.source_commit || github.sha }}
          WSB_FACADE_IMAGE_DIR: build/facade-images
          WSB_FACADE_IMAGE_CATALOG: tools/map_pipeline/shariatpur_facade_images.json
        run: |
          python tools/map_pipeline/build_dhaka_division.py \
            --pbf build/osm/dhaka-division-envelope.osm.pbf \
            --tile-degrees "${{ inputs.tile_degrees || '0.05' }}" \
            --tile-offset "${{ inputs.tile_offset || '0' }}" \
            --max-tiles "${{ inputs.max_tiles || (github.event_name == 'workflow_dispatch' && '8' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-shariatpur-review]') && '8' || '2')) }}" \
            --stage "${{ inputs.build_stage || 'shariatpur_review' }}" \
            --out build/dhaka-division

      - name: Verify map package and geographic provenance
        env:
          EXPECTED_PIPELINE_COMMIT_SHA: ${{ inputs.source_commit || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("build/dhaka-division")
          manifest = json.loads((root / "map_tiles_manifest.json").read_text())
          expected_commit = os.environ["EXPECTED_PIPELINE_COMMIT_SHA"]
          if manifest.get("pipeline_commit_sha") != expected_commit:
              raise SystemExit("Map manifest pipeline_commit_sha does not match this sequence's pinned source commit")
          if manifest.get("stage_gate_reached"):
              print("Shariatpur review gate already reached; intentionally produced no additional tiles.")
              raise SystemExit(0)
          glbs = list(root.rglob("Dhaka_Explorable_Map.glb"))
          if not glbs:
              raise SystemExit("No GLB tiles were produced")
          if len(glbs) != manifest["tile_count_with_geometry"]:
              raise SystemExit("Manifest GLB count mismatch")
          expected_boundary = "Shariatpur District" if manifest.get("build_stage") == "shariatpur_review" else "Dhaka Division"
          if manifest.get("administrative_boundary", {}).get("name") != expected_boundary:
              raise SystemExit("Administrative boundary metadata mismatch: " + expected_boundary)
          if not (root / "ATTRIBUTION.txt").is_file():
              raise SystemExit("Required attribution is missing")
          feature_counts = {}
          for tile in manifest.get("tiles", []):
              for key, value in tile.get("feature_counts", {}).items():
                  if isinstance(value, (int, float)):
                      feature_counts[key] = feature_counts.get(key, 0) + value
          print(json.dumps({
            "boundary": manifest["administrative_boundary"]["name"],
            "boundary_bbox": manifest["region_south_west_north_east"],
            "tiles_intersecting_boundary": manifest["tile_count_intersecting_boundary"],
            "tiles_with_geometry": len(glbs),
            "source_elements_in_boundary_envelope": manifest["source_elements_in_boundary_envelope"],
            "feature_counts_in_this_batch": feature_counts,
            "glb_bytes": sum(p.stat().st_size for p in glbs),
          }, indent=2))
          PY

      - name: Record batch metadata
        id: batch-meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/dhaka-division/map_tiles_manifest.json").read_text())
          offset = int(manifest["tile_batch_offset"])
          count = int(manifest["tile_batch_count"])
          total = int(manifest["tile_count_intersecting_boundary"])
          shariatpur_total = int(manifest["tile_order_priority"]["tiles_intersecting_shariatpur_district"])
          stage = manifest.get("build_stage", "shariatpur_review")
          gate_reached = bool(manifest.get("stage_gate_reached", False))
          if gate_reached:
              next_offset = -1
          elif stage == "shariatpur_review":
              # This stage is deliberately a hard gate: no automatic dispatch into
              # other districts until Shariatpur's standalone quality review passes.
              next_offset = offset + count if offset + count < shariatpur_total else -1
          else:
              next_offset = offset + count if offset + count < total else -1
          print(f"next_offset={next_offset}")
          print(f"total_tiles={total}")
          print(f"shariatpur_tiles={shariatpur_total}")
          print(f"build_stage={stage}")
          print(f"stage_gate_reached={'true' if gate_reached else 'false'}")
          PY

      - name: Upload Dhaka Division map batch
        if: steps.batch-meta.outputs.stage_gate_reached != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Project-A-Square-Dhaka-Division-${{ inputs.sequence_id || github.run_id }}-batch-${{ inputs.tile_offset || '0' }}-attempt-${{ inputs.retry_count || '0' }}
          path: build/dhaka-division/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

  retry-map:
    needs: build-map
    if: failure() && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[build-shariatpur-review]')) || (github.event_name == 'workflow_dispatch' && (inputs.sequence_id == '' || inputs.source_commit != ''))) && fromJSON(inputs.retry_count || '0') < 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry the same bounded batch after a failed run
        env:
          GH_TOKEN: ${{ github.token }}
          TILE_DEGREES: ${{ inputs.tile_degrees || '0.05' }}
          TILE_OFFSET: ${{ inputs.tile_offset || '0' }}
          MAX_TILES: ${{ inputs.max_tiles || '8' }}
          SEQUENCE_ID: ${{ inputs.sequence_id || github.run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          RETRY_COUNT: ${{ inputs.retry_count || '0' }}
          CONTINUE_FULL: ${{ inputs.continue_full_division || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-shariatpur-review]')) }}
          BUILD_STAGE: ${{ inputs.build_stage || 'shariatpur_review' }}
        run: |
          set -euo pipefail
          NEXT_RETRY_COUNT=$((RETRY_COUNT + 1))
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/dhaka-3d-map.yml/dispatches" --input - <<EOF
          {
            "ref": "${GITHUB_REF_NAME}",
            "inputs": {
              "tile_degrees": "${TILE_DEGREES}",
              "tile_offset": "${TILE_OFFSET}",
              "max_tiles": "${MAX_TILES}",
              "continue_full_division": "${CONTINUE_FULL}",
              "build_stage": "${BUILD_STAGE}",
              "sequence_id": "${SEQUENCE_ID}",
              "source_commit": "${SOURCE_COMMIT}",
              "retry_count": "${NEXT_RETRY_COUNT}"
            }
          }
          EOF

  continue-map:
    needs: build-map
    if: ${{ always() && (inputs.assemble_only || (github.event_name == 'push' && contains(github.event.head_commit.message, '[assemble-shariatpur-review:')) || (success() && ((github.event_name == 'workflow_dispatch' && inputs.continue_full_division) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-shariatpur-review]')))) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout pinned source commit for package assembly
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build-map.outputs.source_commit || inputs.source_commit || github.sha }}

      - name: Set up Python for package assembly
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install map package assembly dependencies
        run: python -m pip install numpy trimesh

      - name: Dispatch the next bounded tile batch
        if: ${{ !inputs.assemble_only && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[assemble-shariatpur-review:')) && needs.build-map.outputs.next_offset != '-1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_OFFSET: ${{ needs.build-map.outputs.next_offset }}
          TILE_DEGREES: ${{ needs.build-map.outputs.tile_degrees }}
          MAX_TILES: ${{ needs.build-map.outputs.max_tiles }}
          SEQUENCE_ID: ${{ needs.build-map.outputs.sequence_id }}
          SOURCE_COMMIT: ${{ needs.build-map.outputs.source_commit }}
          BUILD_STAGE: ${{ needs.build-map.outputs.build_stage }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/dhaka-3d-map.yml/dispatches" --input - <<EOF
          {
            "ref": "${GITHUB_REF_NAME}",
            "inputs": {
              "tile_degrees": "${TILE_DEGREES}",
              "tile_offset": "${NEXT_OFFSET}",
              "max_tiles": "${MAX_TILES}",
              "continue_full_division": "true",
              "build_stage": "${BUILD_STAGE}",
              "sequence_id": "${SEQUENCE_ID}",
              "source_commit": "${SOURCE_COMMIT}",
              "retry_count": "0"
            }
          }
          EOF

      - name: Mark Shariatpur review gate reached
        if: ${{ inputs.assemble_only || (github.event_name == 'push' && contains(github.event.head_commit.message, '[assemble-shariatpur-review:')) || (needs.build-map.outputs.next_offset == '-1' && needs.build-map.outputs.build_stage == 'shariatpur_review') }}
        run: |
          echo "Shariatpur-first batch sequence reached its review gate."
          echo "Do not start the full Dhaka Division stage until exterior fidelity, coverage, interiors, and Android integration are reviewed."

      - name: Assemble complete Shariatpur District review package
        if: ${{ inputs.assemble_only || (github.event_name == 'push' && contains(github.event.head_commit.message, '[assemble-shariatpur-review:')) || (needs.build-map.outputs.next_offset == '-1' && needs.build-map.outputs.build_stage == 'shariatpur_review' && needs.build-map.outputs.stage_gate_reached != 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE_ID: ${{ inputs.sequence_id || needs.build-map.outputs.sequence_id || github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            marker_id="$(printf '%s' "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE}" | sed -n 's/.*\[assemble-shariatpur-review:\([0-9][0-9]*\)\].*/\1/p')"
            if [[ -n "${marker_id}" ]]; then SEQUENCE_ID="${marker_id}"; fi
          fi
          mkdir -p build/shariatpur/batches
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/dhaka-3d-map.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_branch, (.conclusion // "")] | @tsv' > /tmp/map-runs.tsv
          prefix="Project-A-Square-Dhaka-Division-${SEQUENCE_ID}-batch-"
          while read -r run_id branch conclusion; do
            [[ "${branch}" == "${GITHUB_REF_NAME}" ]] || continue
            build_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '.jobs[] | select(.name == "build-map") | .conclusion' | head -n 1)"
            [[ "${build_conclusion}" == "success" ]] || continue
            while IFS= read -r artifact_name; do
              [[ "${artifact_name}" == "${prefix}"* ]] || continue
              offset="${artifact_name##*-batch-}"
              offset="${offset%%-attempt-*}"
              destination="build/shariatpur/batches/${offset}"
              mkdir -p "${destination}"
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir "${destination}"
              if [[ ! -f "${destination}/map_tiles_manifest.json" ]]; then
                nested_manifest="$(find "${destination}" -mindepth 2 -name map_tiles_manifest.json -print -quit)"
                if [[ -n "${nested_manifest}" ]]; then
                  nested_root="$(dirname "${nested_manifest}")"
                  find "${nested_root}" -mindepth 1 -maxdepth 1 -exec mv -t "${destination}" {} +
                  rm -rf "${nested_root}"
                fi
              fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')
          done < <(tac /tmp/map-runs.tsv)
          PYTHONPATH="${GITHUB_WORKSPACE}" python tools/map_pipeline/merge_dhaka_division_batches.py \
            --batches-dir build/shariatpur/batches \
            --out build/shariatpur-full \
            --stage shariatpur_review

      - name: Upload complete Shariatpur District review package
        if: ${{ inputs.assemble_only || (github.event_name == 'push' && contains(github.event.head_commit.message, '[assemble-shariatpur-review:')) || (needs.build-map.outputs.next_offset == '-1' && needs.build-map.outputs.build_stage == 'shariatpur_review' && needs.build-map.outputs.stage_gate_reached != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: Project-A-Square-Shariatpur-Review-Map-${{ inputs.sequence_id || needs.build-map.outputs.sequence_id || github.run_id }}
          path: build/shariatpur-full/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

      - name: Assemble all batches into one complete Dhaka Division map
        if: needs.build-map.outputs.next_offset == '-1' && needs.build-map.outputs.build_stage == 'full_division'
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE_ID: ${{ needs.build-map.outputs.sequence_id }}
        run: |
          set -euo pipefail
          mkdir -p build/complete/batches
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/dhaka-3d-map.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_branch, (.conclusion // "")] | @tsv' > /tmp/map-runs.tsv
          if ! grep -q "^${GITHUB_RUN_ID}[[:space:]]" /tmp/map-runs.tsv; then
            printf '%s\tmain\tsuccess\n' "${GITHUB_RUN_ID}" >> /tmp/map-runs.tsv
          fi
          prefix="Project-A-Square-Dhaka-Division-${SEQUENCE_ID}-batch-"
          while read -r run_id branch conclusion; do
            [[ "${branch}" == "main" ]] || continue
            [[ "${conclusion}" == "success" || "${run_id}" == "${GITHUB_RUN_ID}" ]] || continue
            while IFS= read -r artifact_name; do
              [[ "${artifact_name}" == "${prefix}"* ]] || continue
              offset="${artifact_name##*-batch-}"
              offset="${offset%%-attempt-*}"
              destination="build/complete/batches/${offset}"
              mkdir -p "${destination}"
              gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir "${destination}"
              if [[ ! -f "${destination}/map_tiles_manifest.json" ]]; then
                nested_manifest="$(find "${destination}" -mindepth 2 -name map_tiles_manifest.json -print -quit)"
                if [[ -n "${nested_manifest}" ]]; then
                  nested_root="$(dirname "${nested_manifest}")"
                  find "${nested_root}" -mindepth 1 -maxdepth 1 -exec mv -t "${destination}" {} +
                  rm -rf "${nested_root}"
                fi
              fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')
          done < /tmp/map-runs.tsv
          python tools/map_pipeline/merge_dhaka_division_batches.py \
            --batches-dir build/complete/batches \
            --out build/dhaka-division-full

      - name: Upload complete Dhaka Division map
        if: needs.build-map.outputs.next_offset == '-1' && needs.build-map.outputs.build_stage == 'full_division'
        uses: actions/upload-artifact@v4
        with:
          name: Project-A-Square-Dhaka-Division-Full-Map-${{ needs.build-map.outputs.sequence_id }}
          path: build/dhaka-division-full/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
