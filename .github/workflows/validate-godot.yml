name: Validate Godot Project Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "world.gd"
      - "character_visual.gd"
      - "external_content/**"
      - "tools/fetch_quaternius_character.py"
      - "tools/merge_quaternius_character.mjs"
      - "tools/verify_quaternius_character.py"
      - "player.gd"
      - "vehicle.gd"
      - "hud.gd"
      - "district_map_display.gd"
      - "real_dhaka_tile_loader.gd"
      - "Main.tscn"
      - "project.godot"
      - "tests/test_dhaka_map_pipeline.py"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "world.gd"
      - "character_visual.gd"
      - "external_content/**"
      - "tools/fetch_quaternius_character.py"
      - "tools/merge_quaternius_character.mjs"
      - "tools/verify_quaternius_character.py"
      - "player.gd"
      - "vehicle.gd"
      - "hud.gd"
      - "district_map_display.gd"
      - "real_dhaka_tile_loader.gd"
      - "Main.tscn"
      - "project.godot"
      - "tests/test_dhaka_map_pipeline.py"
      - ".github/workflows/validate-godot.yml"

permissions:
  contents: read

concurrency:
  group: godot-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical project
        uses: actions/checkout@v5

      - name: Validate character asset pipeline Python syntax
        run: python3 -m py_compile tools/fetch_quaternius_character.py tools/verify_quaternius_character.py

      - name: Restore cached Quaternius CC0 hero and animation libraries
        uses: actions/cache@v4
        with:
          path: external_content/quaternius_hero
          key: ${{ runner.os }}-quaternius-hero-v3-superhero-pinned-source-fdbf1804-cc73fc4e-4008ea20

      - name: Fetch and validate the CC0 rigged player hero
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_quaternius_character.py
          python3 tools/verify_quaternius_character.py

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"

      - name: Parse and import all project scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          "$GODOT" --headless --editor --path . --quit > "$RUNNER_TEMP/godot/import.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/import.log"
          if [ "$result" -ne 0 ] || grep -E "SCRIPT ERROR:|Parse Error|Failed to load script" "$RUNNER_TEMP/godot/import.log" || (grep -E "ERROR:" "$RUNNER_TEMP/godot/import.log" | grep -vF 'ERROR: Parameter "t" is null.'); then
            exit 1
          fi

      - name: Run headless game startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          timeout 30s "$GODOT" --headless --path . --quit-after 600 > "$RUNNER_TEMP/godot/startup.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/startup.log"
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            exit "$result"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|Invalid call|Invalid get index|ERROR:" "$RUNNER_TEMP/godot/startup.log"; then
            exit 1
          fi

          if python3 -c 'import json,pathlib; p=pathlib.Path("external_content/quaternius_hero/asset_manifest.json"); raise SystemExit(0 if p.exists() and json.loads(p.read_text(encoding="utf-8")).get("available") is True else 1)'; then
            grep -Fq "AUTHORED_HERO_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "CC0 hero asset is available but the runtime did not activate it." >&2
              exit 1
            }
            grep -Fq "AUTHORED_HERO_GEAR_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "CC0 hero activated but scale-matched combat gear was not created at runtime." >&2
              exit 1
            }
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Runtime-Validation-Logs
          path: ${{ runner.temp }}/godot/*.log
          if-no-files-found: ignore
          retention-days: 14
