name: Validate Godot Project Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "world.gd"
      - "player.gd"
      - "vehicle.gd"
      - "hud.gd"
      - "district_map_display.gd"
      - "real_dhaka_tile_loader.gd"
      - "Main.tscn"
      - "project.godot"
      - "tests/test_dhaka_map_pipeline.py"
      - "tools/map_pipeline/package_map_pack.gd"
      - "tests/fixtures/map_pack/**"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "world.gd"
      - "player.gd"
      - "vehicle.gd"
      - "hud.gd"
      - "district_map_display.gd"
      - "real_dhaka_tile_loader.gd"
      - "Main.tscn"
      - "project.godot"
      - "tests/test_dhaka_map_pipeline.py"
      - "tools/map_pipeline/package_map_pack.gd"
      - "tests/fixtures/map_pack/**"
      - ".github/workflows/validate-godot.yml"

permissions:
  contents: read

concurrency:
  group: godot-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical project
        uses: actions/checkout@v5

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"

      - name: Parse and import all project scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          "$GODOT" --headless --editor --path . --quit > "$RUNNER_TEMP/godot/import.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/import.log"
          if [ "$result" -ne 0 ] || grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|ERROR:" "$RUNNER_TEMP/godot/import.log"; then
            exit 1
          fi

      - name: Run headless game startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          timeout 30s "$GODOT" --headless --path . --quit-after 120 > "$RUNNER_TEMP/godot/startup.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/startup.log"
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            exit "$result"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|Invalid call|Invalid get index|ERROR:" "$RUNNER_TEMP/godot/startup.log"; then
            exit 1
          fi

      - name: Smoke-test installable map PCK creation and runtime mounting
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          mkdir -p build/map-pack-smoke
          "$GODOT" --headless --path . --script tools/map_pipeline/package_map_pack.gd -- --source tests/fixtures/map_pack --output build/map-pack-smoke/map-pack-smoke.pck
          test -s build/map-pack-smoke/map-pack-smoke.pck

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Runtime-Validation-Logs
          path: ${{ runner.temp }}/godot/*.log
          if-no-files-found: ignore
          retention-days: 14
