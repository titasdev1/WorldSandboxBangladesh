name: Validate Godot Project Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/lobby-operator-showcase
    paths:
      - "**.gd"
      - "tools/check_gdscript_bool_casts.py"
      - "tests/test_gdscript_bool_cast_checker.py"
      - "world.gd"
      - "character_visual.gd"
      - "npc.gd"
      - "player_vehicle_dynamics.gd"
      - "virtual_stick.gd"
      - "systems/npc_simulation_lod_manager.gd"
      - "systems/activities/pitchbound_3d.gd"
      - "tests/npc_simulation_lod_smoke.gd"
      - "tests/player_input_runtime_smoke.gd"
      - "tests/mobile_joystick_runtime_smoke.gd"
      - "tests/player_vehicle_physics_smoke.gd"
      - "tests/pitchbound_runtime_smoke.gd"
      - "external_content/**"
      - "tools/fetch_quaternius_character.py"
      - "tools/merge_quaternius_character.mjs"
      - "tools/verify_quaternius_character.py"
      - "player.gd"
      - "vehicle.gd"
      - "hud.gd"
      - "tests/test_lobby_operator_showcase.py"
      - "assets/ui/icons/**"
      - "district_map_display.gd"
      - "real_dhaka_tile_loader.gd"
      - "Main.tscn"
      - "Boot.tscn"
      - "boot.gd"
      - "vehicle.gd"
      - "tests/vehicle_entry_exit_animation_smoke.gd"
      - "tests/vehicle_entry_exit_visual_stub.gd"
      - "tests/vehicle_entry_exit_world_stub.gd"
      - "systems/login_backdrop.gd"
      - "systems/login_backdrop_view.gd"
      - "systems/login_operator_actor.gd"
      - "tests/login_backdrop_runtime_smoke.gd"
      - "tests/test_login_backdrop.py"
      - "project.godot"
      - "tests/test_dhaka_map_pipeline.py"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.gd"
      - "tools/check_gdscript_bool_casts.py"
      - "tests/test_gdscript_bool_cast_checker.py"
      - "world.gd"
      - "character_visual.gd"
      - "external_content/**"
      - "tools/fetch_quaternius_character.py"
      - "tools/merge_quaternius_character.mjs"
      - "tools/verify_quaternius_character.py"
      - "player.gd"
      - "vehicle.gd"
      - "hud.gd"
      - "district_map_display.gd"
      - "real_dhaka_tile_loader.gd"
      - "Main.tscn"
      - "Boot.tscn"
      - "boot.gd"
      - "systems/login_backdrop.gd"
      - "systems/login_backdrop_view.gd"
      - "systems/login_operator_actor.gd"
      - "tests/login_backdrop_runtime_smoke.gd"
      - "tests/test_login_backdrop.py"
      - "project.godot"
      - "tests/test_dhaka_map_pipeline.py"
      - ".github/workflows/validate-godot.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: godot-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical project
        uses: actions/checkout@v5

      - name: Reject invalid GDScript bool constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_gdscript_bool_cast_checker.py' -v
          python3 tools/check_gdscript_bool_casts.py --self-test
          python3 tools/check_gdscript_bool_casts.py --root .

      - name: Validate character asset pipeline Python syntax
        run: python3 -m py_compile tools/fetch_quaternius_character.py tools/verify_quaternius_character.py tools/fetch_charactercreator_hero.py tools/convert_charactercreator_glbs.py

      - name: Verify icon-led lobby navigation and page routing
        run: python3 -m unittest discover -s tests -p "test_lobby_operator_showcase.py" -v

      - name: Restore cached Quaternius CC0 hero and animation libraries
        uses: actions/cache@v4
        with:
          path: external_content/quaternius_hero
          key: ${{ runner.os }}-quaternius-hero-v3-superhero-pinned-source-fdbf1804-cc73fc4e-4008ea20

      - name: Fetch and validate the CC0 rigged player hero
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_quaternius_character.py
          python3 tools/verify_quaternius_character.py

      - name: Restore pinned CharacterCreator human and outfit layers
        uses: actions/cache@v4
        with:
          path: external_content/asquare_charactercreator
          key: ${{ runner.os }}-asquare-charactercreator-v2-852e48f316b90a0937234886630e4fb4cdfd1f78

      - name: Fetch and validate modular CharacterCreator operator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_charactercreator_hero.py --required

      - name: Dequantize CharacterCreator GLBs for Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/convert_charactercreator_glbs.py

      - name: Resolve profile-matched Ara 3D operator asset
        id: ara-operator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          PROFILE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=tools/ara3d/asquare_operator.params.json&sha=${BRANCH}&per_page=1" --jq '.[0].sha // empty')"
          if [[ -z "${PROFILE_COMMIT}" ]]; then
            echo "Could not resolve the latest Ara character-profile commit from GitHub history." >&2
            exit 1
          fi
          RUN_RECORD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PROFILE_COMMIT}&per_page=100" \
            --jq ".workflow_runs | map(select(.workflow_id == 417330351 and .head_sha == \"${PROFILE_COMMIT}\" and .head_branch == \"${BRANCH}\")) | sort_by(.created_at) | last // empty | [.id, .status, (.conclusion // \"\")] | @tsv")"
          if [[ -z "${RUN_RECORD}" ]]; then
            echo "No Ara operator build exists for profile ${PROFILE_COMMIT} on ${BRANCH}." >&2
            exit 1
          fi
          read -r RUN_ID STATUS CONCLUSION <<< "${RUN_RECORD}"
          if [[ "${STATUS}" != "completed" || "${CONCLUSION}" != "success" ]]; then
            echo "Profile-matched Ara build is not successful: run=${RUN_ID} status=${STATUS} conclusion=${CONCLUSION}." >&2
            exit 1
          fi
          ARTIFACT_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "A-Square-Ara3D-Operator-Candidates" and .expired == false) | .digest' | head -n 1)"
          if [[ -z "${ARTIFACT_DIGEST}" ]]; then
            echo "Ara build did not publish its validated LOD candidate artifact." >&2
            exit 1
          fi
          echo "Matched Ara profile=${PROFILE_COMMIT}; run=${RUN_ID}; artifact digest=${ARTIFACT_DIGEST}."
          {
            echo "run_id=${RUN_ID}"
            echo "profile_commit=${PROFILE_COMMIT}"
            echo "artifact_digest=${ARTIFACT_DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Download profile-matched Ara operator LOD candidates
        uses: actions/download-artifact@v4
        with:
          name: A-Square-Ara3D-Operator-Candidates
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ara-operator.outputs.run_id }}
          path: build/ara3d-operator-candidates

      - name: Verify and install high-detail Ara operator for runtime smoke
        shell: bash
        env:
          ARA_PROFILE_COMMIT: ${{ steps.ara-operator.outputs.profile_commit }}
          ARA_WORKFLOW_RUN_ID: ${{ steps.ara-operator.outputs.run_id }}
          ARA_ARTIFACT_DIGEST: ${{ steps.ara-operator.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          ROOT="build/ara3d-operator-candidates"
          HIGH="$(find "$ROOT/high" -maxdepth 1 -type f -name '*.glb' -print -quit)"
          MEDIUM="$(find "$ROOT/medium" -maxdepth 1 -type f -name '*.glb' -print -quit)"
          LOW="$(find "$ROOT/low" -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$HIGH" && test -s "$HIGH" && test -n "$MEDIUM" && test -s "$MEDIUM" && test -n "$LOW" && test -s "$LOW"
          python3 tools/ara3d/verify_ara_glb.py --high "$HIGH" --medium "$MEDIUM" --low "$LOW" --out "$ROOT/verification.json"
          ARA_HIGH_GLB="$HIGH" python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("build/ara3d-operator-candidates")
          high = Path(os.environ["ARA_HIGH_GLB"])
          report = json.loads((root / "verification.json").read_text(encoding="utf-8"))
          if report.get("validation") != "PASS" or report.get("errors"):
              raise SystemExit("ARA3D_ASSET_GATE: structural verification did not pass.")
          data = report["variants"]["high"]
          destination = Path("external_content/ara3d_operator")
          high_dir = destination / "high"
          high_dir.mkdir(parents=True, exist_ok=True)
          installed = high_dir / "a_square_bangladesh_operator.glb"
          shutil.copy2(high, installed)
          manifest = {
              "available": True,
              "source": "Ara 3D Gen",
              "source_repository": "https://github.com/olatunde85/3d-gen",
              "source_commit": report["generator_commit"],
              "profile_commit": os.environ["ARA_PROFILE_COMMIT"],
              "workflow_run_id": int(os.environ["ARA_WORKFLOW_RUN_ID"]),
              "artifact_digest": os.environ["ARA_ARTIFACT_DIGEST"],
              "file": installed.as_posix(),
              "sha256": hashlib.sha256(installed.read_bytes()).hexdigest(),
              "bytes": installed.stat().st_size,
              "triangles": data["triangles"],
              "materials": data["materials"],
              "textures": data["textures"],
              "joint_count": data["max_joint_count"],
              "weapon_socket": data["weapon_socket"],
              "facial_morph_targets": data["facial_morph_targets"],
              "animation_count": data["animation_count"],
              "required_animation_groups": data["required_animation_groups"],
              "license": report["license"]
          }
          (destination / "ara_asset_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          shutil.copy2(root / "ASSET-LICENSES.txt", destination / "ASSET-LICENSES.txt")
          print("ARA3D_OPERATOR_INSTALLED:", json.dumps(manifest, sort_keys=True))
          PY

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --silent --show-error \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"

      - name: Parse and import all project scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          "$GODOT" --headless --editor --path . --quit > "$RUNNER_TEMP/godot/import.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/import.log"
          if [ "$result" -ne 0 ] || grep -E "SCRIPT ERROR:|Parse Error|Failed to load script" "$RUNNER_TEMP/godot/import.log" || (grep -E "ERROR:" "$RUNNER_TEMP/godot/import.log" | grep -vF 'ERROR: Parameter "t" is null.'); then
            exit 1
          fi

      - name: Exercise Ara operator rig, locomotion, first-person body, weapon socket and BR parachute animations
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          LOG="$RUNNER_TEMP/godot/ara-operator.log"
          set +e
          timeout 120s "$GODOT" --headless --path . --script tests/ara_operator_runtime_smoke.gd > "$LOG" 2>&1
          result=$?
          set -e
          cat "$LOG"
          if [ "$result" -ne 0 ] || ! grep -Fq "ARA3D_RUNTIME_PASS" "$LOG" || grep -E "SCRIPT ERROR:|Parse Error|Invalid call|Invalid get index|ERROR:" "$LOG"; then
            echo "Ara operator runtime smoke failed."
            exit 1
          fi

      - name: Exercise NPC distance-simulation LOD in Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/npc_simulation_lod_smoke.gd

      - name: Exercise player movement and jump
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/player_input_runtime_smoke.gd

      - name: Exercise mobile joystick
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/mobile_joystick_runtime_smoke.gd

      - name: Exercise vehicle acceleration and braking
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/player_vehicle_physics_smoke.gd

      - name: Exercise Pitchbound 3D
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path . --script res://tests/pitchbound_runtime_smoke.gd

      - name: Exercise animated login backdrop in an isolated SubViewport
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          timeout 40s "$GODOT" --headless --path . --script tests/login_backdrop_runtime_smoke.gd > "$RUNNER_TEMP/godot/login-backdrop.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/login-backdrop.log"
          if [ "$result" -ne 0 ] || ! grep -Fq "LOGIN_BACKDROP_RUNTIME_PASS" "$RUNNER_TEMP/godot/login-backdrop.log" || grep -E "SCRIPT ERROR:|Parse Error|Invalid call|Invalid get index|ERROR:" "$RUNNER_TEMP/godot/login-backdrop.log"; then
            echo "Animated login backdrop runtime smoke failed."
            exit 1
          fi

      - name: Exercise authored vehicle boarding and alighting in Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          LOG="$RUNNER_TEMP/godot/vehicle-entry-exit.log"
          set +e
          timeout 90s "$GODOT" --headless --path . --script tests/vehicle_entry_exit_animation_smoke.gd > "$LOG" 2>&1
          result=$?
          set -e
          cat "$LOG"
          if [ "$result" -ne 0 ] || ! grep -Fq "VEHICLE_ENTRY_EXIT_ANIMATION_PASS" "$LOG" || grep -E "SCRIPT ERROR:|Parse Error|Invalid call|Invalid get index|ERROR:" "$LOG"; then
            echo "Vehicle entry/exit animation runtime smoke failed."
            exit 1
          fi


      - name: Run headless game startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"
          set +e
          WSB_AUTOSTART_MAP_FOR_SMOKE=1 timeout 30s "$GODOT" --headless --path . --quit-after 600 > "$RUNNER_TEMP/godot/startup.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/godot/startup.log"
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            exit "$result"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error|Failed to load script|Invalid call|Invalid get index|ERROR:" "$RUNNER_TEMP/godot/startup.log"; then
            exit 1
          fi

          if python3 -c 'import json,pathlib; p=pathlib.Path("external_content/ara3d_operator/ara_asset_manifest.json"); raise SystemExit(0 if p.exists() and json.loads(p.read_text(encoding="utf-8")).get("available") is True else 1)'; then
            grep -Fq "ARA3D_OPERATOR_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "Ara 3D operator artifact is installed but was not activated at runtime." >&2
              exit 1
            }
            grep -Fq "ARA3D_OPERATOR_GEAR_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "Ara 3D operator activated but its bone-attached gear was not created." >&2
              exit 1
            }
          elif python3 -c 'import json,pathlib; p=pathlib.Path("external_content/asquare_charactercreator/asset_manifest.json"); raise SystemExit(0 if p.exists() and json.loads(p.read_text(encoding="utf-8")).get("available") is True else 1)'; then
            # The preferred modular human is selected before the Quaternius
            # compatibility fallback. Validate only the path actually selected.
            grep -Fq "CHARACTER_CREATOR_HERO_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "CharacterCreator assets are available but the modular humanoid did not activate." >&2
              exit 1
            }
            grep -Fq "CHARACTER_CREATOR_COMBAT_GEAR_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "CharacterCreator humanoid activated but bone-attached gear was not created." >&2
              exit 1
            }
          elif python3 -c 'import json,pathlib; p=pathlib.Path("external_content/quaternius_hero/asset_manifest.json"); raise SystemExit(0 if p.exists() and json.loads(p.read_text(encoding="utf-8")).get("available") is True else 1)'; then
            grep -Fq "AUTHORED_HERO_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "CC0 fallback hero asset is available but the runtime did not activate it." >&2
              exit 1
            }
            grep -Fq "AUTHORED_HERO_GEAR_READY" "$RUNNER_TEMP/godot/startup.log" || {
              echo "CC0 fallback hero activated but scale-matched combat gear was not created at runtime." >&2
              exit 1
            }
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Runtime-Validation-Logs
          path: ${{ runner.temp }}/godot/*.log
          if-no-files-found: ignore
          retention-days: 14
