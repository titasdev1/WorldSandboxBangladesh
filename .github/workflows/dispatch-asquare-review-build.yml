name: Dispatch A-Square Android review build

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 78 &&
      github.event.comment.user.login == 'titasdev1' &&
      (contains(github.event.comment.body, '/asquare-build') ||
       contains(github.event.comment.body, '/asquare-validate'))
    runs-on: ubuntu-latest
    steps:
      - name: Validate the exact project branch and dispatch its Android build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref // empty' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha // empty' <<<"${pr_json}")"

          if [[ "${head_repo}" != "${REPOSITORY}" ]]; then
            echo "Refusing to build a forked repository head." >&2
            exit 1
          fi
          if [[ "${head_ref}" != "feature/lobby-operator-showcase" ]]; then
            echo "Refusing to dispatch an unapproved branch: ${head_ref}" >&2
            exit 1
          fi
          if [[ -z "${head_sha}" ]]; then
            echo "PR head SHA is missing." >&2
            exit 1
          fi

          echo "Dispatching Project A-Square Android review build."
          echo "PR: ${PR_NUMBER}"
          echo "Branch: ${head_ref}"
          echo "Exact source SHA: ${head_sha}"
          gh workflow run android.yml --repo "${REPOSITORY}" --ref "${head_ref}" --field map_package=shariatpur_review
          echo "Android workflow dispatch request accepted for ${head_ref}."
