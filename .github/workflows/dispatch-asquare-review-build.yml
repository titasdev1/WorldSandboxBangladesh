name: Dispatch A-Square Android review build

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 78 &&
      github.event.comment.user.login == 'titasdev1' &&
      (contains(github.event.comment.body, '/asquare-build') ||
       contains(github.event.comment.body, '/asquare-map-build') ||
       contains(github.event.comment.body, '/asquare-validate') ||
       contains(github.event.comment.body, '/asquare-cancel'))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a targeted project validation or the full Android build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "${COMMENT_BODY}" =~ ^[[:space:]]*/asquare-cancel[[:space:]]+44251728526[[:space:]]*$ ]]; then
            echo "Cancelling the unintended Android export run 44251728526."
            gh run cancel 44251728526 --repo "${REPOSITORY}"
            exit 0
          fi

          if [[ "${COMMENT_BODY}" =~ ^[[:space:]]*/asquare-map-build[[:space:]]*$ ]]; then
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<<"${pr_json}")"
            head_ref="$(jq -r '.head.ref // empty' <<<"${pr_json}")"
            head_sha="$(jq -r '.head.sha // empty' <<<"${pr_json}")"

            if [[ "${head_repo}" != "${REPOSITORY}" || "${head_ref}" != "feature/lobby-operator-showcase" || -z "${head_sha}" ]]; then
              echo "Refusing Shariatpur map build: project PR head is not the approved canonical branch." >&2
              exit 1
            fi

            sequence_id="shariatpur-${head_sha:0:12}"
            echo "Dispatching pinned Shariatpur-first map sequence ${sequence_id} from ${head_ref} at ${head_sha}."
            gh workflow run dhaka-3d-map.yml --repo "${REPOSITORY}" --ref "${head_ref}" \
              --field tile_degrees=0.05 \
              --field tile_offset=0 \
              --field max_tiles=8 \
              --field build_stage=shariatpur_review \
              --field continue_full_division=true \
              --field sequence_id="${sequence_id}" \
              --field source_commit="${head_sha}" \
              --field assemble_only=false \
              --field retry_count=0
            exit 0
          fi

          if [[ "${COMMENT_BODY}" == *"/asquare-build"* ]]; then
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<<"${pr_json}")"
            head_ref="$(jq -r '.head.ref // empty' <<<"${pr_json}")"
            head_sha="$(jq -r '.head.sha // empty' <<<"${pr_json}")"

            if [[ "${head_repo}" != "${REPOSITORY}" || "${head_ref}" != "feature/lobby-operator-showcase" || -z "${head_sha}" ]]; then
              echo "Refusing full Android build: project PR head is not the approved canonical branch." >&2
              exit 1
            fi

            echo "Dispatching full Android review build from ${head_ref} at ${head_sha}."
            gh workflow run android.yml --repo "${REPOSITORY}" --ref "${head_ref}" --field map_package=shariatpur_review
            exit 0
          fi

          if [[ "${COMMENT_BODY}" =~ ^[[:space:]]*/asquare-validate[[:space:]]+(workbench/godot-lod-validation|feature/lobby-operator-showcase)[[:space:]]*$ ]]; then
            validation_ref="${BASH_REMATCH[1]}"
            encoded_ref="${validation_ref//\//%2F}"
            branch_json="$(gh api "repos/${REPOSITORY}/branches/${encoded_ref}")"
            validation_sha="$(jq -r '.commit.sha // empty' <<<"${branch_json}")"
            if [[ -z "${validation_sha}" ]]; then
              echo "Validation branch ref could not be resolved." >&2
              exit 1
            fi

            if [[ "${validation_ref}" == "feature/lobby-operator-showcase" ]]; then
              pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
              pr_head_ref="$(jq -r '.head.ref // empty' <<<"${pr_json}")"
              pr_head_sha="$(jq -r '.head.sha // empty' <<<"${pr_json}")"
              if [[ "${pr_head_ref}" != "${validation_ref}" || "${pr_head_sha}" != "${validation_sha}" ]]; then
                echo "The validation branch does not match the current PR head; refusing a stale validation." >&2
                exit 1
              fi
            fi

            echo "Dispatching lightweight Godot validation from ${validation_ref} at ${validation_sha}."
            gh workflow run validate-godot.yml --repo "${REPOSITORY}" --ref "${validation_ref}"
            exit 0
          fi

          echo "Comment does not match an approved A-Square command." >&2
          exit 1
