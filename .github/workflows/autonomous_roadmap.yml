name: Autonomous Roadmap Loop
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical project
        run: |
          test -f project.godot
          test -f development_roadmap.md
          test -f development_state.json
          test -f .github/workflows/finalize.yml
      - name: Record bounded checkpoint
        run: |
          python3 - <<'PY'
          import json,datetime
          p='development_state.json'
          d=json.load(open(p))
          d['automation_note']='Autonomous loop is bounded: build/QA/checkpoint only; source feature invention remains model-driven.'
          d['last_checkpoint_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          d['canonical_archive_policy']='single final archive; preserve all prior features; exclude nested ZIPs'
          open(p,'w').write(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development_state.json
          git diff --cached --quiet || git commit -m "Record autonomous development checkpoint"
          git push