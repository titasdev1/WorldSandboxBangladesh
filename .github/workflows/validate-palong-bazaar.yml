name: Build Palong Bazar environment art

on:
  pull_request:
    branches:
      - feature/lobby-operator-showcase
      - main
    paths:
      - "tools/make_palong_bazaar_textures.py"
      - "tools/fetch_polyhaven_pbr_materials.py"
      - "tools/blender/build_palong_bazaar_environment.py"
      - "tools/verify_palong_bazaar_environment.py"
      - "tests/test_palong_bazaar_environment.py"
      - "tests/test_polyhaven_material_fetcher.py"
      - "docs/quality/PALONG-BAZAAR-ART-DIRECTION.md"
      - "docs/quality/PALONG-THANA-HERO-ART-DIRECTION.md"
      - "tools/blender/build_palong_thana_hero.py"
      - "tests/test_palong_thana_hero.py"
      - ".github/workflows/validate-palong-bazaar.yml"
  push:
    branches:
      - "art/shariatpur-riverfront-streetfront"
    paths:
      - "tools/make_palong_bazaar_textures.py"
      - "tools/fetch_polyhaven_pbr_materials.py"
      - "tools/blender/build_palong_bazaar_environment.py"
      - "tools/verify_palong_bazaar_environment.py"
      - "tests/test_palong_bazaar_environment.py"
      - "tests/test_polyhaven_material_fetcher.py"
      - "tools/blender/build_palong_thana_hero.py"
      - "tests/test_palong_thana_hero.py"
      - "docs/quality/PALONG-THANA-HERO-ART-DIRECTION.md"
      - ".github/workflows/validate-palong-bazaar.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: palong-bazaar-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-palong-bazaar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Install image and font dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils python3-numpy python3-pil fontconfig fonts-noto-core

      - name: Restore pinned Blender 5.2.4
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.2.4
          key: blender-linux-5.2.4-lts

      - name: Install and validate Blender 5.2.4 LTS
        shell: bash
        run: |
          set -euo pipefail
          source tools/install_blender_ci.sh
          blender --version

      - name: Validate source scripts and offline downloader tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/make_palong_bazaar_textures.py \
            tools/fetch_polyhaven_pbr_materials.py \
            tools/blender/build_palong_bazaar_environment.py \
            tools/verify_palong_bazaar_environment.py \
            tests/test_palong_bazaar_environment.py \
            tests/test_polyhaven_material_fetcher.py
          python3 -m unittest discover -s tests -p "test_polyhaven_material_fetcher.py" -v
          python3 -m py_compile tools/blender/build_palong_thana_hero.py tests/test_palong_thana_hero.py
          python3 -m unittest discover -s tests -p "test_palong_thana_hero.py" -v


      - name: Download retained source tile for Palong Model Thana
        uses: actions/download-artifact@v4
        with:
          name: Project-A-Square-Dhaka-Division-44257499872-batch-0-attempt-0
          path: build/shariatpur-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 44257499872

      - name: Generate original Bengali sign artwork and fallback materials
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="build/palong-bazaar"
          mkdir -p "$OUT_DIR"
          python3 tools/make_palong_bazaar_textures.py --out "$OUT_DIR/textures" --size 2048 \
            > "$OUT_DIR/texture-generation.log" 2>&1
          cat "$OUT_DIR/texture-generation.log"
          grep -Fq "A2_PALONG_TEXTURES_READY:" "$OUT_DIR/texture-generation.log"

      - name: Download real CC0 photographic PBR surfaces from Poly Haven
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="build/palong-bazaar"
          python3 tools/fetch_polyhaven_pbr_materials.py --out "$OUT_DIR/textures" --resolution 2k \
            > "$OUT_DIR/polyhaven-download.log" 2>&1
          cat "$OUT_DIR/polyhaven-download.log"
          grep -Fq "A2_POLYHAVEN_PBR_READY:" "$OUT_DIR/polyhaven-download.log"
          test -s "$OUT_DIR/textures/polyhaven_material_manifest.json"
          cat >> "$OUT_DIR/textures/LICENSE.txt" <<'CREDITS'

Photographic PBR surface scans: Poly Haven (CC0).
Required provider credit: Powered by Poly Haven.
Source metadata and downloaded map checksums: polyhaven_material_manifest.json.
CREDITS

      - name: Author Palong Bazar market corridor in Blender
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="build/palong-bazaar"
          blender --background --factory-startup \
            --python tools/blender/build_palong_bazaar_environment.py -- \
            --out "$OUT_DIR/palong_bazaar_market_corridor.glb" \
            --textures "$OUT_DIR/textures" \
            --preview "$OUT_DIR/palong_bazaar_preview.png" \
            --blend "$OUT_DIR/palong_bazaar_environment.blend" \
            --manifest "$OUT_DIR/asset_manifest.json" \
            > "$OUT_DIR/authoring.log" 2>&1 || { cat "$OUT_DIR/authoring.log"; exit 1; }
          cat "$OUT_DIR/authoring.log"
          grep -Fq "A2_PALONG_BAZAAR_READY:" "$OUT_DIR/authoring.log"

      - name: Verify embedded PBR maps, geometry, provenance and game-camera render
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="build/palong-bazaar"
          cp "$OUT_DIR/textures/LICENSE.txt" "$OUT_DIR/LICENSE.txt"
          python3 tools/verify_palong_bazaar_environment.py \
            --glb "$OUT_DIR/palong_bazaar_market_corridor.glb" \
            --manifest "$OUT_DIR/asset_manifest.json" \
            --license "$OUT_DIR/LICENSE.txt" \
            --preview "$OUT_DIR/palong_bazaar_preview.png" \
            --out "$OUT_DIR/verification.json"
          A2_PALONG_BAZAAR_OUTPUT="$OUT_DIR" \
            python3 -m unittest discover -s tests -p "test_palong_bazaar_environment.py" -v


      - name: Author source-aligned Palong Model Thana and detached gateway in Blender
        shell: bash
        run: |
          set -euo pipefail
          TILE_DIR="$(find build/shariatpur-source -type f -path "*/tile_23p1835_90p3053/map_manifest.json" -print -quit | xargs -r dirname)"
          if [[ -z "${TILE_DIR}" ]]; then
            echo "Pinned Shariatpur artifact did not contain tile_23p1835_90p3053." >&2
            exit 1
          fi
          BENGALI_FONT="$(fc-match -f '%{file}' 'Noto Sans Bengali' | head -n 1)"
          OUT_DIR="build/palong-thana"
          mkdir -p "${OUT_DIR}"
          blender --background --factory-startup \
            --python tools/blender/build_palong_thana_hero.py -- \
            --source-geojson "${TILE_DIR}/Dhaka_OSM_Source.geojson" \
            --tile-manifest "${TILE_DIR}/map_manifest.json" \
            --out-dir "${OUT_DIR}" \
            --bengali-font "${BENGALI_FONT}" \
            --pbr-manifest "build/palong-bazaar/textures/polyhaven_material_manifest.json" \
            > "build/palong-thana-authoring.log" 2>&1 || { cat build/palong-thana-authoring.log; exit 1; }
          cat build/palong-thana-authoring.log
          grep -Fq "A2_PALONG_THANA_HERO_READY:" build/palong-thana-authoring.log
          python3 -m json.tool "${OUT_DIR}/asset_manifest.json" > /dev/null

      - name: Upload Palong Bazar authoring diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Palong-Bazar-Authoring-Diagnostics
          path: |
            build/palong-bazaar/texture-generation.log
            build/palong-bazaar/polyhaven-download.log
            build/palong-bazaar/authoring.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload editable Palong Bazar Blender source and rendered art review
        uses: actions/upload-artifact@v4
        with:
          name: Palong-Bazar-Market-Corridor-Study
          path: |
            build/palong-bazaar/palong_bazaar_market_corridor.glb
            build/palong-bazaar/palong_bazaar_environment.blend
            build/palong-bazaar/palong_bazaar_preview.png
            build/palong-bazaar/asset_manifest.json
            build/palong-bazaar/textures/polyhaven_material_manifest.json
            build/palong-bazaar/verification.json
            build/palong-bazaar/LICENSE.txt
          if-no-files-found: error
          retention-days: 30


      - name: Upload Palong Model Thana hero diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Palong-Thana-Hero-Diagnostics
          path: build/palong-thana-authoring.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload source-aligned Palong Thana shell and detached gateway review assets
        uses: actions/upload-artifact@v4
        with:
          name: Palong-Thana-Hero-Review
          path: |
            build/palong-thana/palong_thana_authoring.blend
            build/palong-thana/palong_thana_shell.glb
            build/palong-thana/palong_thana_entrance_gate_concept.glb
            build/palong-thana/palong_thana_shell_preview.png
            build/palong-thana/palong_thana_gate_concept_preview.png
            build/palong-thana/asset_manifest.json
          if-no-files-found: error
          retention-days: 30

